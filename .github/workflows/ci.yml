name: CI Sprint 1

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: ecologistica
          POSTGRES_PASSWORD: ecologistica
          POSTGRES_DB: ecologistica
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ecologistica -d ecologistica"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://ecologistica:ecologistica@localhost:5432/ecologistica
      AUTH_BCRYPT_ROUNDS: "4"
      APP_ENVIRONMENT: demo
      ALLOW_DEMO_ACCOUNTS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Python dependency audit
        run: |
          pip install pip-audit
          pip-audit --strict -r backend/requirements.txt
      - name: Pytest with coverage
        run: pytest --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/frontend

  sonar:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: vars.SONAR_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/frontend
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'workflow_dispatch'
    environment: staging
    steps:
      - name: Staging deploy placeholder
        run: |
          echo "Configurar despliegue con secretos STAGING_* (SSH, registry o PaaS)."
          echo "Este job no despliega sin credenciales explícitas en GitHub Environments."
