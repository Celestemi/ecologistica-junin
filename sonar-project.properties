sonar.projectKey=ecologistica-huancayo
sonar.projectName=EcoLogistica Huancayo
sonar.projectVersion=0.1.0

sonar.sources=app,src
sonar.tests=tests,src
sonar.test.inclusions=tests/**/*.py,src/**/*.test.ts

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml

sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

sonar.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/frontend/Dockerfile,**/backend/Dockerfile
sonar.coverage.exclusions=app/db/init_db.py
